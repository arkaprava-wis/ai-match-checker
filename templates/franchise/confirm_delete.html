{% extends 'base/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
  <h3>Confirm Deletion</h3>
  <p>Are you sure you want to delete the Franchise <strong>{{ object.name }}</strong>?</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'franchise' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock content %}
