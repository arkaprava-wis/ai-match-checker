<!-- Assign Students panel (shared by exam detail and assign-students pages).
     Pass hide_dedicated_link=True to hide the link to the standalone
     assignment page (used on that page itself). -->
<div class="card">
    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Assign Students</h5>
        {% if not hide_dedicated_link %}
            <a href="{% url 'exam_assign_students_page' exam.id %}" class="btn btn-sm btn-outline-light text-nowrap"
               title="Open the dedicated student assignment page">
                <i class="bx bx-link-external"></i> Separate Page
            </a>
        {% endif %}
    </div>
    <div class="card-body">
        <!-- Franchise Selection -->
        <div class="mb-3">
            <label for="franchise-select" class="form-label">Select Franchise:</label>
            <select id="franchise-select" class="form-select">
                <option value="">Choose a franchise...</option>
                {% for franchise in franchises %}
                    <option value="{{ franchise.id }}">{{ franchise.name }}{% if franchise.franchise_code %} ({{ franchise.franchise_code }}){% endif %} - {{ franchise.location }}</option>
                {% endfor %}
            </select>
        </div>

        {% if franchise_api_error %}
            <div class="alert alert-warning small">
                <i class="bx bx-info-circle me-1"></i>
                Franchise list loaded from local records (central API unavailable):
                {{ franchise_api_error }}
            </div>
        {% endif %}

        <!-- Search Filter -->
        <div class="mb-3" id="search-section" style="display: none;">
            <label for="student-search" class="form-label">Search Students:</label>
            <input type="text" id="student-search" class="form-control" placeholder="Search by name, code, level, or location...">
        </div>

        <!-- Students List -->
        <div id="students-container" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6>Students List:</h6>
                <div>
                    <button type="button" id="select-all-btn" class="btn btn-sm btn-outline-primary">Select All</button>
                    <button type="button" id="clear-all-btn" class="btn btn-sm btn-outline-secondary">Clear All</button>
                </div>
            </div>

            <div id="students-list" class="border rounded p-0" style="max-height: 400px; overflow-y: auto;">
                <!-- Students will be loaded here via AJAX as a table -->
            </div>

            <div class="mt-3">
                <button type="button" id="assign-students-btn" class="btn btn-primary">
                    <i class="bx bx-plus"></i> Assign Selected Students
                </button>
                <span id="selected-count" class="ms-2 text-muted">0 selected</span>
            </div>
        </div>

        <!-- Loading indicator -->
        <div id="loading-indicator" style="display: none;">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p>Loading students...</p>
            </div>
        </div>
    </div>
</div>
